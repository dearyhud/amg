server {
  listen 80;

  # Redirects must stay relative: the container listens on 80 but is
  # published on an arbitrary host port, which absolute Location headers
  # would drop (localhost:8080 -> localhost/admin/).
  absolute_redirect off;

  # Admin API: /admin/api/* -> admin plane (prefix stripped).
  # Buffering off so the approvals SSE stream flows through.
  location /admin/api/ {
    proxy_pass http://amg-admin:9293/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Agent-facing MCP endpoint (data plane) — exposed here for one-port
  # local setups; agents can also hit amg-data:9292 directly.
  location /mcp {
    proxy_pass http://amg-data:9292/mcp;
    proxy_set_header Host $host;
  }

  # The console SPA
  location /admin/ {
    root /usr/share/nginx/html;
    try_files $uri /admin/index.html;
  }

  location = / {
    return 302 /admin/;
  }
}
